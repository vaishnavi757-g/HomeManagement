<!DOCTYPE html>
<html>

<head>
    <title>Login - Home Management System</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="page-container">

        <h1>🔐 Login</h1>

        <p class="page-subtitle">
            Login to your Home Management System
        </p>

        {% if message %}
            <p>{{ message }}</p>
        {% endif %}

        <div class="form-box">

            <form method="POST" action="/login">

                <input
                    type="text"
                    name="username"
                    placeholder="Enter username"
                    required
                >

                <br><br>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >

                <br>

                <button type="submit">
                    Login
                </button>

            </form>

        </div>

        <p>
            Don't have an account?
            <a href="/register">Register</a>
        </p>

        <a href="/" class="back-link">
            ← Back to Home
        </a>

    </div>

</body>

</html>
